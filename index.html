<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>I LOVE MOM 3000</title>
<style>
  :root{
    --orbit-size: min(94vw, 94vh, 760px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;
    width:100%;height:100%;
    overflow:hidden;
    background:linear-gradient(135deg,#ffd6e8,#ff9fc7,#ffd6e8);
    background-size:300% 300%;
    animation:bgShift 12s ease-in-out infinite;
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    touch-action:manipulation;
  }
  @keyframes bgShift{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
  }

  .stage{
    position:relative;
    width:100vw;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .orbit-container{
    position:relative;
    width:var(--orbit-size);
    height:var(--orbit-size);
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .center-text{
    position:relative;
    z-index:50;
    font-size:clamp(1.6rem, 6vw, 3rem);
    font-weight:800;
    text-align:center;
    color:#ff2d6b;
    text-shadow:
      0 0 10px rgba(255,255,255,0.9),
      0 0 20px rgba(255,105,180,0.8),
      0 2px 4px rgba(0,0,0,0.15);
    letter-spacing:1px;
    padding:0 0.5em;
    animation:pulse 2.4s ease-in-out infinite;
    user-select:none;
    pointer-events:none;
  }
  @keyframes pulse{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.06);}
  }

  .orbit-item{
    position:absolute;
    top:50%;
    left:50%;
    transform-origin:0 0;
    animation:spin linear infinite;
    will-change:transform;
  }
  @keyframes spin{
    from{transform:rotate(0deg) translateX(var(--radius)) rotate(0deg);}
    to{transform:rotate(360deg) translateX(var(--radius)) rotate(-360deg);}
  }

  .orbit-item .inner{
    display:flex;
    align-items:center;
    justify-content:center;
    animation:bob ease-in-out infinite;
  }
  @keyframes bob{
    0%,100%{transform:translateY(0) scale(1);}
    50%{transform:translateY(-6px) scale(1.05);}
  }

  /* ===============================
     ขนาดรูปภาพ (Responsive)
     ค่าเหล่านี้เป็น "ค่าเป้าหมายเริ่มต้น" ตาม breakpoint
     JavaScript จะคำนวณขนาดจริงเพิ่มเติมโดยอิงจาก
     จำนวนรูป + พื้นที่หน้าจอ แล้ว set ทับผ่าน inline style
     เพื่อให้ขนาดรูปกับระยะวงโคจรสอดคล้องกันเสมอ
     =============================== */
  .mom-img{
    /* มือถือทั่วไป: เป้าหมาย 120–150px */
    width:clamp(120px, 34vmin, 150px);
    height:clamp(120px, 34vmin, 150px);
    border-radius:50%;
    object-fit:cover;
    border:4px solid #fff;
    box-shadow:0 4px 16px rgba(255,45,107,0.5), 0 0 0 2px rgba(255,255,255,0.6);
  }

  /* มือถือจอเล็ก: เป้าหมาย 100–120px */
  @media (max-width:360px){
    .mom-img{
      width:clamp(100px, 30vmin, 120px);
      height:clamp(100px, 30vmin, 120px);
    }
  }

  /* มือถือจอใหญ่ (เช่น Pro Max / Plus): เป้าหมาย 150–170px */
  @media (min-width:430px) and (max-width:699px){
    .mom-img{
      width:clamp(140px, 36vmin, 170px);
      height:clamp(140px, 36vmin, 170px);
    }
  }

  /* Tablet */
  @media (min-width:700px){
    .mom-img{
      width:clamp(130px, 20vmin, 170px);
      height:clamp(130px, 20vmin, 170px);
    }
  }

  /* Desktop: ไม่จำเป็นต้องใหญ่เท่ามือถือตามสัดส่วนจอ */
  @media (min-width:1100px){
    .mom-img{
      width:clamp(90px, 10vmin, 140px);
      height:clamp(90px, 10vmin, 140px);
    }
  }

  .heart{
    font-size:clamp(20px, 6vw, 34px);
    filter:drop-shadow(0 2px 4px rgba(255,60,120,0.4));
  }

  .tap-fx{
    position:fixed;
    pointer-events:none;
    font-size:24px;
    z-index:999;
    animation:floatUp 1s ease-out forwards;
  }
  @keyframes floatUp{
    0%{transform:translate(-50%,-50%) scale(0.6);opacity:1;}
    60%{transform:translate(-50%,-160%) scale(1.2);opacity:1;}
    100%{transform:translate(-50%,-240%) scale(1);opacity:0;}
  }
</style>
</head>
<body>

<div class="stage">
  <div class="orbit-container" id="orbitContainer">
    <div class="center-text">I LOVE MOM 3000</div>
  </div>
</div>

<script>
/* ===============================
   CONFIG: จำนวนรูปที่จะพยายามโหลด
   เปลี่ยนตัวเลขนี้เพื่อเพิ่ม/ลดจำนวนรูป
   =============================== */
const IMAGE_COUNT = 10;

const IMAGE_FOLDER = "images/";
const IMAGE_EXTENSIONS = ["jpg", "jpeg", "png", "webp"];
const HEARTS = ["❤️", "💗", "💖", "💕", "💓", "💞"];
const TAP_EFFECTS = ["❤️", "💖", "✨", "💕", "⭐"];

const orbitContainer = document.getElementById("orbitContainer");

// ตรวจสอบว่ารูปมีอยู่จริงหรือไม่ โดยลองโหลดทีละ extension
function tryLoadImage(index) {
  return new Promise((resolve) => {
    let extIdx = 0;

    function attempt() {
      if (extIdx >= IMAGE_EXTENSIONS.length) {
        resolve(null); // ไม่มีรูปนี้เลย ข้ามไป
        return;
      }
      const ext = IMAGE_EXTENSIONS[extIdx];
      const src = `${IMAGE_FOLDER}Mom${index}.${ext}`;
      const img = new Image();
      img.onload = () => resolve(src);
      img.onerror = () => {
        extIdx++;
        attempt();
      };
      img.src = src;
    }
    attempt();
  });
}

// อ่านขนาดรูปเป้าหมายตาม breakpoint ปัจจุบัน (ให้ตรงกับค่าใน CSS .mom-img)
function getTargetImgSize() {
  const w = window.innerWidth;
  const vmin = Math.min(window.innerWidth, window.innerHeight);
  if (w <= 360) {
    return clampVal(100, vmin * 0.30, 120);
  } else if (w >= 1100) {
    return clampVal(90, vmin * 0.10, 140);
  } else if (w >= 700) {
    return clampVal(130, vmin * 0.20, 170);
  } else if (w >= 430) {
    return clampVal(140, vmin * 0.36, 170);
  } else {
    return clampVal(120, vmin * 0.34, 150);
  }
}

function clampVal(min, val, max) {
  return Math.min(Math.max(val, min), max);
}

/**
 * คำนวณขนาดรูปจริง + รัศมีวงโคจร แบบสมดุล
 * โดยพิจารณาจาก: ขนาดหน้าจอ, จำนวนรูป(+หัวใจ), ขนาดรูปเป้าหมาย
 * ถ้าพื้นที่ไม่พอสำหรับรูปขนาดเป้าหมาย จะค่อยๆ ลดขนาดรูปลง
 * แทนที่จะปล่อยให้รูปเบียด/ทับกัน หรือหลุดขอบจอ
 */
function computeLayout(totalItems) {
  const vmin = Math.min(window.innerWidth, window.innerHeight);
  let imgSize = getTargetImgSize();
  const minImgSize = 70; // ขนาดต่ำสุดที่ยังมองเห็นรูปชัดเจน

  let radius, maxRadius;

  for (let attempt = 0; attempt < 8; attempt++) {
    const edgePadding = imgSize / 2 + 14; // กันรูปชนขอบจอ
    maxRadius = (vmin / 2) - edgePadding;

    const minRadiusFromCenter = imgSize * 0.95 + 46; // กันรูปทับข้อความตรงกลาง

    // ระยะที่ต้องใช้รอบวงเพื่อไม่ให้รูป/หัวใจเบียดกันเกินไป
    const spacingNeededRadius = (imgSize * totalItems * 1.12) / (2 * Math.PI);

    radius = Math.max(vmin * 0.38, minRadiusFromCenter, spacingNeededRadius);

    if (radius <= maxRadius || imgSize <= minImgSize) {
      radius = Math.min(radius, Math.max(maxRadius, minImgSize));
      break;
    }

    // พื้นที่ไม่พอ -> ลดขนาดรูปลงทีละนิด แล้วคำนวณใหม่ (แทนการปล่อยให้เบียดกัน)
    imgSize = Math.max(imgSize * 0.92, minImgSize);
  }

  return { imgSize, radius };
}

async function buildOrbit() {
  // 1. โหลดรูปทั้งหมดที่มีอยู่จริง (ข้ามรูปที่ไม่มี)
  const loadPromises = [];
  for (let i = 1; i <= IMAGE_COUNT; i++) {
    loadPromises.push(tryLoadImage(i));
  }
  const results = await Promise.all(loadPromises);
  const validImages = results.filter(src => src !== null);

  // 2. สร้างรายการ item แบบผสม รูป + หัวใจ
  //    ถ้ามีรูป -> Mom, Heart, Mom, Heart...
  //    ถ้าไม่มีรูปเลย -> ใช้หัวใจอย่างเดียวกระจายรอบวง
  const items = [];
  if (validImages.length > 0) {
    validImages.forEach((src, i) => {
      items.push({ type: "image", src });
      items.push({ type: "heart", char: HEARTS[i % HEARTS.length] });
    });
  } else {
    // ไม่มีรูปเลย ก็ยังมีหัวใจลอยรอบๆ ไม่ให้ว่างเปล่า
    const fallbackCount = 10;
    for (let i = 0; i < fallbackCount; i++) {
      items.push({ type: "heart", char: HEARTS[i % HEARTS.length] });
    }
  }

  // 3. คำนวณขนาดรูป + รัศมีวงโคจรแบบ dynamic (สมดุลตามจำนวนรูป + พื้นที่หน้าจอ)
  const total = items.length;
  const angleStep = 360 / total;
  const { imgSize, radius: baseRadius } = computeLayout(total);

  items.forEach((item, i) => {
    const angle = angleStep * i;
    const duration = 18 + (i % 5) * 2; // ความเร็วต่างกันเล็กน้อยแต่ยังนุ่มนวล
    const delay = -(duration * (i / total)); // กระจายจุดเริ่มรอบวง ไม่กระจุก

    const wrapper = document.createElement("div");
    wrapper.className = "orbit-item";
    wrapper.style.setProperty("--radius", `${baseRadius}px`);
    wrapper.style.animationDuration = `${duration}s`;
    wrapper.style.animationDelay = `${delay}s`;
    wrapper.style.transform = `rotate(${angle}deg) translateX(${baseRadius}px)`;

    const inner = document.createElement("div");
    inner.className = "inner";
    inner.style.animationDuration = `${2 + Math.random() * 1.5}s`;
    inner.style.animationDelay = `${Math.random() * 2}s`;

    if (item.type === "image") {
      const img = document.createElement("img");
      img.src = item.src;
      img.className = "mom-img";
      img.alt = "Mom";
      // ตั้งขนาดจริงตามที่คำนวณไว้ (ให้สอดคล้องกับรัศมีวงโคจรเสมอ)
      img.style.width = `${imgSize}px`;
      img.style.height = `${imgSize}px`;
      img.onerror = () => { wrapper.remove(); }; // เผื่อรูปพังระหว่างแสดงผล ไม่ให้เว็บพัง
      inner.appendChild(img);
    } else {
      const span = document.createElement("span");
      span.className = "heart";
      span.textContent = item.char;
      inner.appendChild(span);
    }

    wrapper.appendChild(inner);
    orbitContainer.appendChild(wrapper);
  });
}

buildOrbit();

// ปรับวงโคจรใหม่เมื่อหมุนจอ (orientation change) เพื่อความ responsive
let resizeTimer;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    document.querySelectorAll(".orbit-item").forEach(el => el.remove());
    buildOrbit();
  }, 300);
});

/* ===============================
   TOUCH / CLICK EFFECT
   =============================== */
function spawnTapEffect(x, y) {
  const el = document.createElement("div");
  el.className = "tap-fx";
  el.textContent = TAP_EFFECTS[Math.floor(Math.random() * TAP_EFFECTS.length)];
  el.style.left = `${x}px`;
  el.style.top = `${y}px`;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1000);
}

document.addEventListener("click", (e) => {
  spawnTapEffect(e.clientX, e.clientY);
});

document.addEventListener("touchstart", (e) => {
  const touch = e.touches[0];
  if (touch) spawnTapEffect(touch.clientX, touch.clientY);
}, { passive: true });
</script>

</body>
</html>
