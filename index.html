<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>I LOVE MOM 3000</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{

    width:100%;
    height:100%;

    margin:0;
    padding:0;

    overflow:hidden;

    touch-action:manipulation;

    font-family:
        "Segoe UI",
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        sans-serif;
}


/* =========================================================
   BACKGROUND
   ========================================================= */

body{

    background:
        linear-gradient(
            135deg,
            #ffd6e8,
            #ff9fc7,
            #ffd6e8
        );

    background-size:300% 300%;

    animation:
        backgroundMove
        12s
        ease-in-out
        infinite;
}


@keyframes backgroundMove{

    0%{
        background-position:0% 50%;
    }

    50%{
        background-position:100% 50%;
    }

    100%{
        background-position:0% 50%;
    }

}


/* =========================================================
   STAGE
   ========================================================= */

.stage{

    position:relative;

    width:100vw;
    height:100vh;

    display:flex;

    align-items:center;
    justify-content:center;

}


/* =========================================================
   ORBIT AREA
   ========================================================= */

.orbit-container{

    position:relative;

    width:min(94vw,94vh);
    height:min(94vw,94vh);

    max-width:760px;
    max-height:760px;

}


/* =========================================================
   CENTER TEXT
   ========================================================= */

.center-text{

    position:absolute;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    z-index:10000;

    width:max-content;

    max-width:90vw;

    color:#ff2d6b;

    font-size:
        clamp(
            1.6rem,
            6vw,
            3rem
        );

    font-weight:800;

    text-align:center;

    letter-spacing:1px;

    white-space:nowrap;

    user-select:none;

    pointer-events:none;

    text-shadow:

        0 0 10px
        rgba(255,255,255,.95),

        0 0 20px
        rgba(255,105,180,.8),

        0 2px 4px
        rgba(0,0,0,.15);

    animation:
        textPulse
        2.4s
        ease-in-out
        infinite;
}


@keyframes textPulse{

    0%,
    100%{

        transform:
            translate(-50%,-50%)
            scale(1);

    }

    50%{

        transform:
            translate(-50%,-50%)
            scale(1.06);

    }

}


/* =========================================================
   =========================================================
   IMAGE
   =========================================================
   ========================================================= */


/*
   ตัวนี้เป็น "จุดโคจร"

   JavaScript จะเปลี่ยน
   left / top ของมัน
*/

.image-item{

    position:absolute;

    left:50%;
    top:50%;

    width:0;
    height:0;

    z-index:200;

    pointer-events:none;

    /*
       สำคัญ:
       ไม่มี rotate
    */

    will-change:
        transform;
}


/*
   รูปจริง
*/

.image-holder{

    position:absolute;

    left:0;
    top:0;

    transform:
        translate(-50%,-50%);

}


/* =========================================================
   IMAGE
   ========================================================= */

.mom-img{

    display:block;

    width:var(--image-size);
    height:var(--image-size);

    border-radius:50%;

    object-fit:cover;

    border:4px solid white;

    background:white;

    box-shadow:

        0 5px 18px
        rgba(255,45,107,.5),

        0 0 0 2px
        rgba(255,255,255,.7);

    /*
       ไม่หมุน
    */

    transform:none;

    user-select:none;

    -webkit-user-drag:none;

}


/* =========================================================
   =========================================================
   HEART
   =========================================================
   ========================================================= */

.heart-item{

    position:absolute;

    left:50%;
    top:50%;

    width:0;
    height:0;

    z-index:5000;

    pointer-events:none;

    will-change:
        transform;

}


.heart-holder{

    position:absolute;

    left:0;
    top:0;

    transform:
        translate(-50%,-50%);

}


.heart{

    display:block;

    font-size:
        var(--heart-size);

    line-height:1;

    white-space:nowrap;

    transform:none;

    user-select:none;

    pointer-events:none;

    filter:
        drop-shadow(
            0 3px 5px
            rgba(255,60,120,.45)
        );

    animation:
        heartFloat
        var(--float-speed)
        ease-in-out
        infinite;

}


/* =========================================================
   HEART FLOAT
   ========================================================= */

@keyframes heartFloat{

    0%,
    100%{

        transform:
            translateY(0)
            scale(1);

    }

    50%{

        transform:
            translateY(-7px)
            scale(1.1);

    }

}


/* =========================================================
   TAP EFFECT
   ========================================================= */

.tap-fx{

    position:fixed;

    pointer-events:none;

    z-index:99999;

    font-size:24px;

    animation:
        tapFloat
        1s
        ease-out
        forwards;

}


@keyframes tapFloat{

    0%{

        transform:
            translate(-50%,-50%)
            scale(.6);

        opacity:1;

    }

    60%{

        transform:
            translate(-50%,-160%)
            scale(1.2);

        opacity:1;

    }

    100%{

        transform:
            translate(-50%,-240%)
            scale(1);

        opacity:0;

    }

}


/* =========================================================
   SMALL SCREEN
   ========================================================= */

@media(max-width:360px){

    .mom-img{

        border-width:3px;

    }

}


/* =========================================================
   LARGE PHONE
   ========================================================= */

@media(min-width:430px){

    .mom-img{

        border-width:4px;

    }

}

</style>

</head>


<body>


<div class="stage">

    <div
        class="orbit-container"
        id="orbitContainer"
    >

        <div class="center-text">
            I LOVE MOM 3000
        </div>

    </div>

</div>


<script>

/* =========================================================
   CONFIG
   ========================================================= */

const IMAGE_COUNT = 10;

const HEART_COUNT = 40;

const IMAGE_FOLDER = "images/";

const IMAGE_EXTENSIONS = [
    "jpg",
    "jpeg",
    "png",
    "webp"
];

const HEART_TYPES = [
    "❤️",
    "💗",
    "💖",
    "💕",
    "💓",
    "💞",
    "💘",
    "💝"
];

const TAP_EFFECTS = [
    "❤️",
    "💖",
    "✨",
    "💕",
    "⭐"
];


const container =
    document.getElementById(
        "orbitContainer"
    );


/* =========================================================
   OBJECT ARRAYS
   ========================================================= */

let imageObjects = [];

let heartObjects = [];


/*
   เวลาที่เริ่ม animation
*/

let startTime =
    performance.now();


/* =========================================================
   CLAMP
   ========================================================= */

function clamp(
    min,
    value,
    max
){

    return Math.min(
        Math.max(value,min),
        max
    );

}


/* =========================================================
   FIND IMAGE
   ========================================================= */

function findImage(index){

    return new Promise(
        resolve => {

            let extIndex=0;


            function next(){

                if(
                    extIndex >=
                    IMAGE_EXTENSIONS.length
                ){

                    resolve(null);

                    return;

                }


                const ext =
                    IMAGE_EXTENSIONS[
                        extIndex
                    ];


                const src =
                    `${IMAGE_FOLDER}Mom${index}.${ext}`;


                const img =
                    new Image();


                img.onload=()=>{

                    resolve(src);

                };


                img.onerror=()=>{

                    extIndex++;

                    next();

                };


                img.src=src;

            }


            next();

        }
    );

}


/* =========================================================
   IMAGE SIZE
   ========================================================= */

function getImageSize(){

    const w =
        window.innerWidth;

    const h =
        window.innerHeight;

    const vmin =
        Math.min(w,h);


    if(w>=430){

        return clamp(
            145,
            vmin*.40,
            190
        );

    }


    if(w>360){

        return clamp(
            130,
            vmin*.38,
            175
        );

    }


    return clamp(
        110,
        vmin*.32,
        145
    );

}


/* =========================================================
   IMAGE LAYOUT
   ========================================================= */

function getImageLayout(
    count,
    size
){

    const vmin =
        Math.min(
            window.innerWidth,
            window.innerHeight
        );


    /*
       ยิ่งค่ามาก
       รูปยิ่งห่างกัน
    */

    const circumference =
        count *
        size *
        1.45;


    let radius =
        circumference /
        (2*Math.PI);


    /*
       กันชนข้อความ
    */

    radius =
        Math.max(
            radius,
            size*.9+50,
            vmin*.35
        );


    /*
       ขอบจอ
    */

    const maxRadius =
        vmin/2 -
        size/2 -
        8;


    let finalSize =
        size;


    /*
       ถ้าใหญ่เกินไป
       ลดรูปลง
    */

    while(
        radius>maxRadius &&
        finalSize>100
    ){

        finalSize*=.94;


        radius=Math.max(

            (
                count*
                finalSize*
                1.45
            )
            /
            (2*Math.PI),

            finalSize*.9+50,

            vmin*.35

        );

    }


    radius=
        Math.min(
            radius,
            maxRadius
        );


    return {

        radius:radius,

        size:finalSize

    };

}


/* =========================================================
   CREATE IMAGES
   ========================================================= */

async function createImages(){

    const promises=[];


    for(
        let i=1;
        i<=IMAGE_COUNT;
        i++
    ){

        promises.push(
            findImage(i)
        );

    }


    const results=
        await Promise.all(
            promises
        );


    const images=
        results.filter(
            x=>x!==null
        );


    if(!images.length){

        return;

    }


    const initialSize=
        getImageSize();


    const layout=
        getImageLayout(
            images.length,
            initialSize
        );


    const angleStep=
        360/images.length;


    images.forEach(
        (
            src,
            index
        )=>{

            /*
               รูปแต่ละใบ
               อยู่ห่างเท่ากันจริง
            */

            const angle=
                -90+
                index*
                angleStep;


            const item=
                document.createElement(
                    "div"
                );


            item.className=
                "image-item";


            item.style.setProperty(
                "--image-size",
                `${layout.size}px`
            );


            const holder=
                document.createElement(
                    "div"
                );


            holder.className=
                "image-holder";


            const img=
                document.createElement(
                    "img"
                );


            img.className=
                "mom-img";


            img.src=
                src;


            img.alt=
                "Mom";


            img.draggable=false;


            holder.appendChild(img);

            item.appendChild(holder);

            container.appendChild(item);


            imageObjects.push({

                element:item,

                angle:angle,

                radius:layout.radius,

                /*
                   24 วินาที / รอบ
                */

                speed:
                    (2*Math.PI)/24000

            });

        }
    );

}


/* =========================================================
   CREATE HEARTS
   ========================================================= */

function createHearts(){

    const vmin=
        Math.min(
            window.innerWidth,
            window.innerHeight
        );


    for(
        let i=0;
        i<HEART_COUNT;
        i++
    ){

        /*
           กระจายด้วย
           Golden Angle
        */

        const angle=
            (
                i*
                137.508
            )%360;


        /*
           หลายวง

           ทำให้หัวใจ
           ไม่อยู่ติดกัน
        */

        const layer=
            i%5;


        const radius=
            vmin*
            (
                .40+
                layer*.075
            );


        /*
           18–38px
        */

        const size=
            18+
            Math.random()*20;


        /*
           20–32 วินาที
        */

        const speed=
            (2*Math.PI)/
            (
                (
                    20+
                    (i%7)*2
                )*1000
            );


        const item=
            document.createElement(
                "div"
            );


        item.className=
            "heart-item";


        const holder=
            document.createElement(
                "div"
            );


        holder.className=
            "heart-holder";


        const heart=
            document.createElement(
                "span"
            );


        heart.className=
            "heart";


        heart.textContent=
            HEART_TYPES[
                i%HEART_TYPES.length
            ];


        item.style.setProperty(
            "--heart-size",
            `${size}px`
        );


        item.style.setProperty(
            "--float-speed",
            `${2+Math.random()*2}s`
        );


        item.style.setProperty(
            "--float-delay",
            `${Math.random()*2}s`
        );


        holder.appendChild(
            heart
        );


        item.appendChild(
            holder
        );


        container.appendChild(
            item
        );


        heartObjects.push({

            element:item,

            angle:angle,

            radius:radius,

            speed:speed

        });

    }

}


/* =========================================================
   MAIN ANIMATION
   ========================================================= */

function animate(
    timestamp
){

    const elapsed=
        timestamp-
        startTime;


    /* =====================================================
       IMAGES
       ===================================================== */

    imageObjects.forEach(
        object=>{

            /*
               หมุนจริง

               elapsed เปลี่ยนทุก frame
            */

            const currentAngle=

                (
                    object.angle*
                    Math.PI/
                    180
                )
                +
                elapsed*
                object.speed;


            /*
               คำนวณ X
            */

            const x=
                Math.cos(
                    currentAngle
                )*
                object.radius;


            /*
               คำนวณ Y
            */

            const y=
                Math.sin(
                    currentAngle
                )*
                object.radius;


            /*
               เปลี่ยนตำแหน่ง

               ไม่มี rotate()
            */

            object.element.style.transform=

                `translate(
                    ${x}px,
                    ${y}px
                )`;

        }
    );


    /* =====================================================
       HEARTS
       ===================================================== */

    heartObjects.forEach(
        object=>{

            const currentAngle=

                (
                    object.angle*
                    Math.PI/
                    180
                )
                +
                elapsed*
                object.speed;


            const x=
                Math.cos(
                    currentAngle
                )*
                object.radius;


            const y=
                Math.sin(
                    currentAngle
                )*
                object.radius;


            /*
               เคลื่อนรอบข้อความ

               แต่ตัวหัวใจ
               ไม่ rotate
            */

            object.element.style.transform=

                `translate(
                    ${x}px,
                    ${y}px
                )`;

        }
    );


    requestAnimationFrame(
        animate
    );

}


/* =========================================================
   BUILD
   ========================================================= */

async function buildScene(){

    /*
       ล้างของเก่า
    */

    container
        .querySelectorAll(
            ".image-item,.heart-item"
        )
        .forEach(
            element=>
                element.remove()
        );


    imageObjects=[];

    heartObjects=[];


    startTime=
        performance.now();


    await createImages();

    createHearts();

}


/* =========================================================
   START
   ========================================================= */

buildScene();


/* =========================================================
   START ANIMATION
   ========================================================= */

requestAnimationFrame(
    animate
);


/* =========================================================
   RESPONSIVE
   ========================================================= */

let resizeTimer;


window.addEventListener(
    "resize",
    ()=>{

        clearTimeout(
            resizeTimer
        );


        resizeTimer=
            setTimeout(
                ()=>{
                    buildScene();
                },
                300
            );

    }
);


/* =========================================================
   TAP EFFECT
   ========================================================= */

function spawnTapEffect(
    x,
    y
){

    const element=
        document.createElement(
            "div"
        );


    element.className=
        "tap-fx";


    element.textContent=
        TAP_EFFECTS[
            Math.floor(
                Math.random()*
                TAP_EFFECTS.length
            )
        ];


    element.style.left=
        `${x}px`;


    element.style.top=
        `${y}px`;


    document.body.appendChild(
        element
    );


    setTimeout(
        ()=>{
            element.remove();
        },
        1000
    );

}


/* =========================================================
   CLICK
   ========================================================= */

document.addEventListener(
    "click",
    event=>{

        spawnTapEffect(
            event.clientX,
            event.clientY
        );

    }
);


/* =========================================================
   TOUCH
   ========================================================= */

document.addEventListener(
    "touchstart",
    event=>{

        const touch=
            event.touches[0];


        if(touch){

            spawnTapEffect(
                touch.clientX,
                touch.clientY
            );

        }

    },
    {
        passive:true
    }
);

</script>

</body>

</html>
